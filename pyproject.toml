[project]
name = "model-eval-service-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
# B008: FastAPI Depends() in defaults is the standard injection pattern.
# BLE001: broad exception capture is required for per-sample failure recording.
ignore = ["B008", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
